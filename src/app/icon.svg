<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The header's mark at tab size: the same square and escaping arrow, but filled rather than
    outlined, because at 16 px three 1.5 px strokes inside a box collapse into a smudge.

    Literal hex, not the CSS custom properties the components use: a favicon is fetched outside the
    document, so there is no stylesheet to resolve them against. They are the petrol and paper
    tokens, and must be changed by hand if those move.

    The scheme swap is measured. Plate against tab strip, which decides whether the mark has a
    silhouette: petrol is 2.34 on Chrome's dark strip and 1.24 on the blue one this was reported in,
    against 15.67 and 8.33 for paper; on a light strip the pairing inverts, 5.26 to 1.28. So each
    scheme takes the plate that survives it. `favicon.ico` cannot do this and carries light only.

    Keep this comment free of double hyphens. XML forbids them and Chrome rejects the whole file
    rather than the comment, so the first draft served a parser error where the icon should be.
  -->
  <style>
    .plate { fill: #00646e }
    .arrow { stroke: #fcfcfa }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #fcfcfa }
      .arrow { stroke: #00646e }
    }
  </style>

  <rect class="plate" width="32" height="32" rx="6" />
  <g class="arrow" stroke-width="3" stroke-linecap="square" fill="none">
    <path d="M10 22 L22 10" />
    <path d="M15.5 10 H22 V16.5" />
  </g>
</svg>
